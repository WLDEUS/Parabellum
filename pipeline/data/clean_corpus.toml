# Clean macOS corpus for the FP gate (pipeline) and ML negatives (ml). Bump `version` when editing:
# the CI cache key includes this file's hash.
#
# [[archive]] entries are pinned (URL + SHA-256, verified on 2026-10-25 by downloading them); a
# changed upstream file fails the hash check and is skipped (logged), never silently trusted.
# [homebrew] formulae are resolved each run through https://formulae.brew.sh/api/formula/<name>.json
# (bottle.stable.files.<tag>.{url,sha256}) and pulled anonymously from ghcr.io; the SHA-256 published
# by the API is verified.
#
# Formats: tar | zip | pkg (xar) | dmg (needs 7zz/7z) | file (single file) | auto.
# Nested pkgs, Payload/Scripts cpio archives and zips/dmgs inside are extracted too (depth 3).

version = 1
# Files bigger than this are hashed for the allowlist but not YARA-scanned.
max_scan_bytes = 104857600

[homebrew]
bottle_tags = ["arm64_sequoia", "arm64_tahoe", "arm64_sonoma", "all"]
formulae = [
  "jq", "wget", "git", "curl", "openssl@3", "python@3.13", "node", "gnupg", "sqlite",
  "yt-dlp", "bash", "zsh", "coreutils", "tmux", "htop", "ripgrep", "ffmpeg", "awscli",
  # dylib-heavy bottles: more clean Mach-O for the ML negatives
  "boost", "postgresql@17", "imagemagick", "go", "vim", "neovim", "opencv", "gdal",
]

