# Parabellum threat-DB sources. Read by `python -m pipeline.build`.
#
# Every URL below was checked on 2026-10-25/26 (see pipeline/README.md, "Sources and verification").
# `{ABUSECH_AUTH_KEY}` is substituted at runtime from the env/secret of the same name and never
# written to the manifest (shown there as `<AUTH-KEY>`) nor to logs.
#
# Licences: personal use on one Mac, no redistribution of the bundle outside the owner's private
# GitHub releases. Re-check every licence before publishing the bundle publicly.

[bundle]
min_client_version = "0.1.0"
# Refuse to publish (keep yesterday's release) if malware hashes or blocked domains drop by more.
sanity_max_drop = 0.5

[hashes]
# Rolling window for all-platform MalwareBazaar hashes, and a hard cap: 2 M x 32 bytes = 64 MB for
# hashes/malware.sha256 (the client mmaps it and binary-searches). macOS samples are kept beyond the
# window (capped separately) since they are few and the most relevant ones.
window_days = 365
max_hashes = 2_000_000
max_macos_named = 200_000
# The full MalwareBazaar dump is only downloaded while the index holds fewer hashes than this.
bootstrap_below = 1000

[malwarebazaar]
# `get_file_type` values (MalwareBazaar labels Mach-O samples "macho") and `get_taginfo` tags used to
# collect macOS samples with names/sizes (-> hashes/malware_names.tsv, clamav/parabellum.hsb).
# Unknown values just return no result.
file_types = ["macho", "dmg", "pkg"]
tags = [
  "macOS", "OSX", "Mach-O", "dmg",
  "AMOS", "AtomicStealer", "Atomic", "Poseidon", "PoseidonStealer", "Banshee", "BansheeStealer",
  "Cuckoo", "CuckooStealer", "Cthulhu", "CthulhuStealer", "RustBucket", "KandyKorn", "XLoader",
  "Adload", "Pirrit", "Shlayer", "Bundlore", "MacSync", "Odyssey", "OdysseyStealer", "Frigidstealer",
]
limit = 1000

[detection]
# Opt-in step (MALWARE_CORPUS=1): samples first seen in the last `days` days, at most `max_samples`.
days = 2
max_samples = 40

# Lowercase MalwareBazaar tag -> canonical family name (used when a sample has no `signature`).
[families]
amos = "AMOS"
atomicstealer = "AMOS"
atomic = "AMOS"
poseidon = "Poseidon"
poseidonstealer = "Poseidon"
banshee = "Banshee"
bansheestealer = "Banshee"
cuckoo = "Cuckoo"
cuckoostealer = "Cuckoo"
cthulhu = "Cthulhu"
cthulhustealer = "Cthulhu"
rustbucket = "RustBucket"
kandykorn = "KandyKorn"
xloader = "XLoader"
adload = "Adload"
pirrit = "Pirrit"
shlayer = "Shlayer"
bundlore = "Bundlore"
macsync = "MacSync"
odyssey = "Odyssey"
odysseystealer = "Odyssey"
frigidstealer = "FrigidStealer"

# ------------------------------------------------------------------------------------------------
# Hashes (abuse.ch). abuse.ch community data: free with an Auth-Key under abuse.ch fair use;
# commercial use requires a subscription. Personal use is fine.
# Keyless URLs (bazaar.abuse.ch/export/...) return 410 Gone since 2026-10-21: the v2 exports take the
# key in the URL path (documented example: https://mb-api.abuse.ch/v2/files/exports/<KEY>/recent.csv).

[[source]]
name = "malwarebazaar-recent"
kind = "hashes"
fetcher = "mb_export"
url = "https://mb-api.abuse.ch/v2/files/exports/{ABUSECH_AUTH_KEY}/recent.csv"
license = "abuse.ch fair use (free Auth-Key; commercial use needs a subscription)"

[[source]]
# Bootstrap only (index < hashes.bootstrap_below). File name inferred from ThreatFox's documented
# `full.csv.zip`; NOT verified (the MalwareBazaar export list is behind login). If it 404s the
# source is reported fresh=false and the index simply fills up from `recent.csv` night after night.
name = "malwarebazaar-full"
kind = "hashes"
fetcher = "mb_export"
url = "https://mb-api.abuse.ch/v2/files/exports/{ABUSECH_AUTH_KEY}/full.csv.zip"
license = "abuse.ch fair use (free Auth-Key; commercial use needs a subscription)"
bootstrap_only = true

[[source]]
# POST query API with the `Auth-Key` header (documented on bazaar.abuse.ch/api).
name = "malwarebazaar-macos"
kind = "hashes"
fetcher = "mb_api_macos"
url = "https://mb-api.abuse.ch/api/v1/"
license = "abuse.ch fair use (free Auth-Key; commercial use needs a subscription)"

# ------------------------------------------------------------------------------------------------
# Malware / phishing domains -> dns/malware.txt

[[source]]
# Documented v2 export (urlhaus.abuse.ch/api: `.../v2/files/exports/<KEY>/recent.csv`); `online.csv`
# = URLs currently online. Hosts only; IP URLs and shared platforms are dropped.
name = "urlhaus"
kind = "domains"
fetcher = "urlhaus_export"
url = "https://urlhaus-api.abuse.ch/v2/files/exports/{ABUSECH_AUTH_KEY}/online.csv"
license = "abuse.ch fair use (free Auth-Key; commercial use needs a subscription)"
category = "malware"

[[source]]
# Documented v2 export (threatfox.abuse.ch/export: `.../v2/files/exports/<KEY>/full.csv.zip`):
# IOCs of the last 6 months; `domain` and `url` IOCs with confidence >= 50 are kept.
name = "threatfox"
kind = "domains"
fetcher = "threatfox_export"
url = "https://threatfox-api.abuse.ch/v2/files/exports/{ABUSECH_AUTH_KEY}/full.csv.zip"
license = "abuse.ch fair use (free Auth-Key; commercial use needs a subscription)"
category = "malware"
min_confidence = 50

[[source]]
# HaGeZi Threat Intelligence Feeds, "medium" (~560 k entries). The full `tif` list is 2.1 M
# entries / 37 MB: too heavy for dnscrypt-proxy's RAM on a laptop. Wildcard "onlydomains" syntax:
# one domain per line, subdomains implied — exactly the bundle semantics.
name = "hagezi-tif-medium"
kind = "domains"
fetcher = "domain_list"
url = "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.medium-onlydomains.txt"
license = "GPL-3.0 (hagezi/dns-blocklists)"
category = "malware"
format = "domains"
min_entries = 10000

