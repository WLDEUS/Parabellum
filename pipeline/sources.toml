# ------------------------------------------------------------------------------------------------
# YARA -> yara/<source>__<file>.yar (each file compiled alone with yara-x, then FP-gated)

[[source]]
# Elastic protections-artifacts, macOS rules only (49 files / 96 rules on 2026-10-23, all compile with
# yara-x 1.22). Note: Elastic uses a numeric `severity` (0-100) metadata.
name = "elastic"
kind = "yara"
fetcher = "yara_tarball"
url = "https://codeload.github.com/elastic/protections-artifacts/tar.gz/refs/heads/main"
license = "Elastic License 2.0"
include = ["yara/rules/macos_*.yar"]

[[source]]
# Florian Roth's signature-base, macOS-specific files only (all compile with yara-x 1.22, no
# external variables). Matches must keep the rule author attribution (DRL 1.1).
name = "signature-base"
kind = "yara"
fetcher = "yara_raw"
url = "https://raw.githubusercontent.com/Neo23x0/signature-base/master/yara"
license = "Detection Rule License (DRL) 1.1"
files = [
  "apt_fancybear_osxagent.yar",
  "apt_lazarus_applejeus.yar",
  "apt_snaketurla_osx.yar",
  "expl_macos_switcharoo_dec22.yar",
  "gen_malware_MacOS_plist_suspicious.yar",
  "gen_osx_backdoor_bella.yar",
  "gen_osx_evilosx.yar",
  "gen_osx_pyagent_persistence.yar",
  "mal_lockbit_lnx_macos_apr23.yar",
]

