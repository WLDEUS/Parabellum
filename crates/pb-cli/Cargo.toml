[package]
name = "pb-cli"
description = "parabellum: command-line client for parabellumd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "pb_cli"
path = "src/lib.rs"

[[bin]]
name = "parabellum"
path = "src/main.rs"

[dependencies]
pb-core = { workspace = true }
pb-privacy = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
# Coffre (hdiutil -plist) and permissions audit (apps' Info.plist).
plist = { workspace = true }
# Nettoyage du Mac (plist above): tree walks, item ids, app archives.
walkdir = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { workspace = true }

# Permissions audit: LaunchServices lookup of bundle ids.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
filetime = "0.2"

[lints]
workspace = true
