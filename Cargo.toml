[workspace]
resolver = "2"
members = [
    "crates/pb-core",
    "crates/pb-engine",
    "crates/pb-ml",
    "crates/pb-monitor",
    "crates/pb-updater",
    "crates/pb-dns",
    "crates/pb-vpn",
    "crates/pb-privacy",
    "crates/pb-daemon",
    "crates/pb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Deus"]
repository = "https://github.com/WLDEUS/Parabellum"
rust-version = "1.95"

# Shared dependency versions. Crates reference them with `dep = { workspace = true }`.
# Workers: do NOT edit this file; add crate-specific extra deps in your own crate's Cargo.toml.
[workspace.dependencies]
pb-core = { path = "crates/pb-core" }
pb-engine = { path = "crates/pb-engine" }
pb-ml = { path = "crates/pb-ml" }
pb-monitor = { path = "crates/pb-monitor" }
pb-updater = { path = "crates/pb-updater" }
pb-dns = { path = "crates/pb-dns" }
pb-vpn = { path = "crates/pb-vpn" }
pb-privacy = { path = "crates/pb-privacy" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
yara-x = "1.22"
goblin = { version = "0.10", default-features = false, features = ["std", "mach64", "mach32", "archive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
tar = "0.4"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
libc = "0.2"
core-foundation = "0.10"
io-kit-sys = "0.4"
plist = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
regex = "1"
walkdir = "2"
once_cell = "1"
base64 = "0.22"
humantime = "2"
humantime-serde = "1"
futures = "0.3"
bytes = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

[profile.dev]
# Keep test binaries small (each links YARA-X/wasmtime): line tables are enough for backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
