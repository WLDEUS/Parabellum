name: Weekly ML training

# Accumulates Mach-O feature vectors (never samples), trains the LightGBM classifier, and promotes it
# to the `ml-latest` release only if it passes the gate (holdout FPR <= 0.1 % and TPR >= current).
# The nightly DB build picks up ml-latest. Secrets: ABUSECH_AUTH_KEY.
# Repository variable ML_FETCH_MALWARE=0 disables sample downloads on GitHub runners (see the GitHub
# Acceptable Use caveat in ml/README.md); positives can then be produced on a local Linux box.

on:
  schedule:
    - cron: "41 4 * * 0" # Sundays 04:41 UTC
  workflow_dispatch:
    inputs:
      max_new_samples:
        description: Max new MalwareBazaar Mach-O samples to featurize
        type: number
        default: 300
      no_malware:
        description: Do not download samples this run
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: threat-db # shared with nightly-db.yml
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" (2026-10)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pb-features
      - name: Build pb-features
        run: cargo build --release -p pb-ml --bin pb-features
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            ml/requirements.txt
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends 7zip
          python -m pip install -r ml/requirements.txt
      - name: Restore clean corpus cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/corpus
          key: corpus-v1-${{ hashFiles('pipeline/data/clean_corpus.toml') }}-${{ github.run_id }}
          restore-keys: |
            corpus-v1-${{ hashFiles('pipeline/data/clean_corpus.toml') }}-
            corpus-v1-
      - name: Download dataset, metrics and current model
        run: |
          mkdir -p prev current
          gh release download ml-dataset -D prev --clobber -p dataset.csv.gz -p metrics.jsonl || echo "no dataset yet"
          gh release download ml-latest -D current --clobber -p macho_model.json -p model_meta.json || echo "no current model"
      - name: Train
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          NO_MALWARE: ${{ (inputs.no_malware || vars.ML_FETCH_MALWARE == '0') && '--no-malware' || '' }}
          MAX_NEW: ${{ inputs.max_new_samples || 300 }}
        run: |
          # shellcheck disable=SC2086 # NO_MALWARE is empty or one flag
          python -m ml.train --pb-features target/release/pb-features --out out/ml \
            --dataset-in prev/dataset.csv.gz --metrics-in prev/metrics.jsonl --current-model current \
            --corpus-cache .cache/corpus --max-new-samples "$MAX_NEW" $NO_MALWARE
      - name: Publish
        run: bash ml/publish.sh out/ml
      - name: Summary
        if: always()
        run: |
          [[ -f out/ml/decision.json ]] || exit 0
          python - <<'PY'
          import json, os
          d = json.load(open("out/ml/decision.json"))
          msg = f"ML: trained={d.get('trained')} promoted={d.get('promoted')} pos={d.get('n_pos')} neg={d.get('n_neg')} — {d.get('reason', '')}"
          print(f"::notice title=ml-train::{msg}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## ML training\n```json\n" + json.dumps(d, indent=2) + "\n```\n")
          PY
