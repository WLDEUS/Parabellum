name: Nightly threat DB

# Rebuilds the signed threat-DB bundle (see crates/pb-core/src/db.rs and pipeline/README.md) and
# publishes it to the `db-latest` release + a dated `db-<version>` release. If any check fails (sanity
# guard, signature mismatch…) nothing is uploaded: clients keep yesterday's bundle.
# Secrets: ABUSECH_AUTH_KEY (abuse.ch, repo secret); MINISIGN_SECRET_KEY + MINISIGN_KEY_PASSWORD (DB key,
# password-protected, environment `db-signing`: branch main only, sign-publish job only — audit SC-1/SC-2).
# Zero Breach Toolkit (pipeline/zbt.py): latest release via the GitHub API (GH_TOKEN), shipped only after
# gpg verifies SHA256SUMS.txt.asc with the pinned publisher key; its `--update` (network) runs here, in CI.
# sing-box pin (pipeline/pins.py): `gh attestation verify --repo SagerNet/sing-box` (gh + GH_TOKEN, job env).
# GDPR broker list (pipeline/privacy.py): Datenanfragen + Eraser at the commits pinned in sources.toml.
# shadowrocket-reject.list (DOMAIN-SET) is uploaded to db-latest next to the bundle by publish.sh.

on:
  schedule:
    # 21:17 UTC (22:17/23:17 Paris): published (30-90 min) well before the daemon's default daily
    # check (updates.daily_hour = 3 local + up to 20 min jitter = 01:00-02:20 UTC). ml-train.yml runs
    # Sundays 17:41 UTC so the Sunday night bundle ships the newly promoted model.
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Publish even if the sanity guard objects (drops > 50 %, minimums, incomplete clean corpus)
        type: boolean
        default: false
      allow_allowlist_growth:
        description: Sign even if verify-db finds an unusual allowlist growth (malware -> allow moves, > 10 %)
        type: boolean
        default: false
      malware_corpus:
        description: Measure the detection rate on today's macOS samples (see GitHub AUP caveat in pipeline/README.md)
        type: boolean
        default: false

# Supply chain (docs/SECURITY-SUPPLY-CHAIN.md): `build-db` downloads untrusted feeds, unpacks malware
# samples with 7-Zip and runs third-party code, so it gets a READ-ONLY token and never sees the signing
# key; it must be assumed compromisable. `verify-db` (fresh runner, read-only token, no secret) re-checks
# the bundle against sources build-db cannot touch (pipeline/verify_bundle.py, audit SC-4) and hands the
# SHA-256 of the verified files to `sign-publish`, which runs no pipeline code: it checks the digests,
# signs with minisign (environment db-signing) and uploads.
permissions:
  contents: read

concurrency:
  group: threat-db # shared with ml-train.yml: never publish model and bundle at the same time
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      attestations: read # gh attestation verify of the pinned sing-box release (pipeline/pins.py)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch "stable" (2026-10)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pb-features-db # not shared with ml-train.yml (which featurizes malware)
      - name: Build pb-features
        run: cargo build --release -p pb-ml --bin pb-features
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.lock
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends minisign 7zip gnupg dirmngr
          python -m pip install --require-hashes -r pipeline/requirements.lock
      - name: Restore clean corpus cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/corpus/dl
            .cache/corpus/bottles.json
          key: corpus-v2-${{ hashFiles('pipeline/data/clean_corpus.toml') }}-${{ github.run_id }}
          restore-keys: |
            corpus-v2-${{ hashFiles('pipeline/data/clean_corpus.toml') }}-
      - name: Download previous bundle and state
        run: |
          mkdir -p prev
          # Only a 404 means "no release yet". Any other failure fails the job: a transient 502 must
          # not turn into a first run (no shrink baseline, empty state published, version restart).
          release_exists() {
            local err
            if err="$(gh api "repos/$GH_REPO/releases/tags/$1" --silent 2>&1)"; then return 0; fi
            [[ "$err" == *"HTTP 404"* ]] && return 1
            echo "::error::cannot query release $1: $err"
            exit 1
          }
          if release_exists db-latest; then
            gh release download db-latest -D prev --clobber -p manifest.json \
              -p parabellum-db.tar.gz -p parabellum-db.tar.gz.minisig \
              -p pipeline-state.tar.gz -p pipeline-state.tar.gz.minisig
            for f in manifest.json parabellum-db.tar.gz pipeline-state.tar.gz; do
              [[ -s "prev/$f" ]] || { echo "::error::db-latest has no $f"; exit 1; }
            done
          else
            echo "::notice::no db-latest release yet (first run)"
          fi
          if [[ -s keys/parabellum-db.pub ]]; then
            for f in parabellum-db.tar.gz pipeline-state.tar.gz; do
              if [[ -f "prev/$f" ]] && ! minisign -Vq -p keys/parabellum-db.pub -m "prev/$f"; then
                echo "::warning::prev/$f has an invalid signature: ignored (prev/manifest.json stays the version floor and shrink baseline)"
                rm -f "prev/$f"
              fi
            done
          fi
      # Signed models only (audit SC-7): unsigned or mixed files are dropped, the builder then carries
      # the previous bundle's model over.
      - name: Download signed ML models
        run: bash scripts/fetch-ml-models.sh ml-latest keys/parabellum-db.pub
      - name: Build bundle (unsigned)
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          MALWARE_CORPUS: ${{ inputs.malware_corpus && '1' || '' }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: |
          [[ -n "$ABUSECH_AUTH_KEY" ]] || echo "::warning::secret ABUSECH_AUTH_KEY is not set: abuse.ch sources are carried over"
          # shellcheck disable=SC2086 # ALLOW_SHRINK is empty or one flag
          python -m pipeline.build --out dist/db \
            --previous prev/parabellum-db.tar.gz --state prev/pipeline-state.tar.gz --published prev/manifest.json \
            --corpus-cache .cache/corpus --ml-dir ml-latest --pb-features target/release/pb-features \
            $ALLOW_SHRINK
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threat-db
          path: |
            dist/db/parabellum-db.tar.gz
            dist/db/pipeline-state.tar.gz
            dist/db/manifest.json
            dist/db/report.json
            dist/db/shadowrocket-reject.list
          retention-days: 1
          if-no-files-found: error
      - name: Summary
        if: always()
        run: |
          [[ -f dist/db/report.json ]] || exit 0
          {
            echo "## Threat DB $(python -c 'import json;print(json.load(open("dist/db/report.json")).get("version",""))')"
            echo '```json'
            python -c 'import json; r = json.load(open("dist/db/report.json")); print(json.dumps({k: r.get(k) for k in ("stats", "sanity_problems", "source_errors", "domains", "detection", "privacy_brokers", "component_pins")}, indent=2))'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Only the downloads (re-checked against their pinned SHA-256 on every run) and the bottle index
      # (validated on load) are cached: the extracted trees are rebuilt each run (pipeline/corpus.py,
      # audit SC-5), so a poisoned cache entry cannot add a file to the clean corpus / allowlist.
      - name: Save clean corpus cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/corpus/dl
            .cache/corpus/bottles.json
          key: corpus-v2-${{ hashFiles('pipeline/data/clean_corpus.toml') }}-${{ github.run_id }}

  verify-db:
    needs: build-db
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read # gh attestation verify of a changed sing-box pin
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      digests: ${{ steps.verify.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends minisign gnupg dirmngr
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: threat-db
          path: ${{ runner.temp }}/db
      # Downloaded again here, independently of build-db: the previous bundle (signature checked) and the
      # signed ML models are the references the new bundle is compared with.
      - name: References (previous signed bundle, signed ML models)
        run: |
          set -euo pipefail
          ref="$RUNNER_TEMP/ref"
          mkdir -p "$ref/prev" "$ref/ml"
          if err="$(gh api "repos/$GH_REPO/releases/tags/db-latest" --silent 2>&1)"; then
            gh release download db-latest -D "$ref/prev" -p parabellum-db.tar.gz -p parabellum-db.tar.gz.minisig
            if ! minisign -Vq -p keys/parabellum-db.pub -m "$ref/prev/parabellum-db.tar.gz"; then
              echo "::error::db-latest has an invalid signature: no trusted reference to compare with"
              exit 1
            fi
          elif [[ "$err" != *"HTTP 404"* ]]; then
            echo "::error::cannot query db-latest: $err"
            exit 1
          fi
          bash scripts/fetch-ml-models.sh "$ref/ml" keys/parabellum-db.pub
      - name: Verify the bundle
        id: verify
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
          ALLOW_GROWTH: ${{ inputs.allow_allowlist_growth && '--allow-allowlist-growth' || '' }}
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/db" ref="$RUNNER_TEMP/ref"
          prev=()
          [[ -f "$ref/prev/parabellum-db.tar.gz" ]] && prev=(--previous "$ref/prev/parabellum-db.tar.gz")
          # shellcheck disable=SC2086 # each flag is empty or one word
          python3 -m pipeline.verify_bundle --bundle "$db/parabellum-db.tar.gz" --manifest "$db/manifest.json" \
            "${prev[@]}" --ml-dir "$ref/ml" $ALLOW_SHRINK $ALLOW_GROWTH
          # What sign-publish may sign: these exact bytes.
          digests="$(cd "$db" && find . -mindepth 1 -printf '%y %P\n' | sort | tr '\n' ';')|$(cd "$db" && sha256sum -- * | sort -k2 | tr '\n' ';')"
          echo "digests=$digests" >> "$GITHUB_OUTPUT"

  sign-publish:
    needs: [build-db, verify-db]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: db-signing # MINISIGN_SECRET_KEY + MINISIGN_KEY_PASSWORD: branch main only
    permissions:
      contents: write # gh release create/upload
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only the public key, the signing helper and the publish script are read from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            keys
            pipeline/publish.sh
            scripts/ci-minisign.sh
          sparse-checkout-cone-mode: false
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends minisign
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: threat-db
          path: dist/db
      - name: Check, sign and verify
        env:
          VERIFIED: ${{ needs.verify-db.outputs.digests }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
          MINISIGN_PUB: keys/parabellum-db.pub
        run: |
          set -euo pipefail
          [[ -s keys/parabellum-db.pub ]] || { echo "::error::keys/parabellum-db.pub is not committed"; exit 1; }
          # Exactly the expected regular files, nothing else (no links, no extra payload).
          expected="manifest.json parabellum-db.tar.gz pipeline-state.tar.gz report.json shadowrocket-reject.list"
          got="$(cd dist/db && find . -mindepth 1 -printf '%y %P\n' | sort | tr '\n' ' ')"
          want="$(for f in $expected; do echo "f $f"; done | sort | tr '\n' ' ')"
          [[ "$got" == "$want" ]] || { echo "::error::unexpected artifact content: $got"; exit 1; }
          # The very bytes verify-db checked (audit SC-4).
          digests="$(cd dist/db && find . -mindepth 1 -printf '%y %P\n' | sort | tr '\n' ';')|$(cd dist/db && sha256sum -- * | sort -k2 | tr '\n' ';')"
          [[ -n "$VERIFIED" && "$digests" == "$VERIFIED" ]] || { echo "::error::artifact differs from what verify-db checked"; exit 1; }
          version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' dist/db/manifest.json)"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "::error::bad version '$version'"; exit 1; }
          bash scripts/ci-minisign.sh sign dist/db/parabellum-db.tar.gz "parabellum-db $version"
          bash scripts/ci-minisign.sh sign dist/db/pipeline-state.tar.gz "parabellum-state $version"
      - name: Publish
        run: bash pipeline/publish.sh dist/db
